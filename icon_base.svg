<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: dark rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="#1a1e2e"/>

  <!-- Three horizontal window containers (Q-style rounded squares) -->
  <!-- Window 1 - unselected -->
  <rect x="68" y="210" width="100" height="100" rx="18" ry="18"
        fill="none" stroke="#4a5568" stroke-width="12"/>

  <!-- Window 2 - SELECTED (teal) -->
  <rect x="206" y="210" width="100" height="100" rx="18" ry="18"
        fill="none" stroke="#2ee8b7" stroke-width="12"/>

  <!-- Window 3 - unselected -->
  <rect x="344" y="210" width="100" height="100" rx="18" ry="18"
        fill="none" stroke="#4a5568" stroke-width="12"/>

  <!-- Stream dots between windows (D-style) -->
  <circle cx="185" cy="260" r="6" fill="#4a5568"/>
  <circle cx="323" cy="260" r="6" fill="#4a5568"/>

  <!-- Down triangle selector above selected window (S-style) -->
  <polygon points="234,170 278,170 256,198" fill="#2ee8b7"/>
</svg>